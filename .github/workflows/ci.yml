name: CI

# Hosting is handled by Cloudflare Pages' GitHub integration (project "brinewake"):
# every push to main deploys to https://brinewake.pages.dev and every branch gets a preview URL.
# This workflow just runs the tests and the production build on every push and PR.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
